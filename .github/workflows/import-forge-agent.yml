name: Copy exact mobile Forge Agent baseline
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-forge-agent.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-forge-agent-baseline
  cancel-in-progress: false
jobs:
  copy:
    if: github.repository == 'damianwalker356-hub/forge-agent-desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}
      - name: Publish identical source tree without changing the mobile repository
        shell: bash
        env:
          SOURCE_SHA: 5b21dc6675a05fd5b6231548bd1de88c1a9bc183
          EXPECTED_PARENT: 9259285d5edce434ae5878aa313953935f1222d9
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 https://github.com/damianwalker356-hub/forge-agent.git "$SOURCE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          SOURCE_TREE=$(git rev-parse "${SOURCE_SHA}^{tree}")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          COPY_COMMIT=$(printf '%s\n' "Copy mobile Forge Agent ${SOURCE_SHA}: identical source tree" | git commit-tree "$SOURCE_TREE" -p "$GITHUB_SHA")
          test "$(git rev-parse "${COPY_COMMIT}^{tree}")" = "$SOURCE_TREE"
          git push origin "${COPY_COMMIT}:refs/heads/main"
          git fetch --no-tags origin main
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$SOURCE_TREE"
          printf 'Verified desktop and mobile tree SHA: %s\n' "$SOURCE_TREE" >> "$GITHUB_STEP_SUMMARY"
